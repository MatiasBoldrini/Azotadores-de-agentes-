name: Request Vercel production deploy

on:
  push:
    branches: [main]

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the Vercel Deploy Hook
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$VERCEL_DEPLOY_HOOK_URL" ]]; then
            echo "::error::Set the VERCEL_DEPLOY_HOOK_URL repository Actions secret."
            exit 1
          fi

          if ! status=$(curl --disable --silent --globoff --proto '=https' \
            --request POST --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --url "$VERCEL_DEPLOY_HOOK_URL"); then
            echo "::error::Could not reach the Vercel Deploy Hook over HTTPS."
            exit 1
          fi

          if [[ "$status" != 2[0-9][0-9] ]]; then
            echo "::error::Vercel Deploy Hook returned HTTP $status."
            exit 1
          fi

          echo "Vercel accepted the deployment request."
